# Render Blueprint Configuration
# Deploy on Render: https://render.com
#
# IMPORTANT: add private environment values in the Render Dashboard.
# Never commit live secrets.

services:
  - type: web
    name: discord-management-bot
    env: node
    buildCommand: npm install --include=dev --no-audit --no-fund
    # index.js loads preload.js itself, so use the same command Render is
    # actually running and avoid two different startup definitions.
    startCommand: node index.js
    numInstances: 1

    # Keep the Discord bot online continuously.
    # Starter avoids Free-tier idle spin-down. If the live service remains on
    # Free, the built-in 8-minute /health keepalive provides additional cover.
    plan: starter

    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: NODE_ENV
        value: production
      - key: GUILD_ID
        value: "1521593407741362257"
      - key: BOT_TOKEN
        sync: false

      # Recommended MongoDB Atlas setup for Render. Keeping the username,
      # password, and host separate lets the bot safely URL-encode credentials.
      - key: MONGODB_USERNAME
        sync: false
      - key: MONGODB_PASSWORD
        sync: false
      - key: MONGODB_HOST
        sync: false
      - key: MONGODB_DATABASE
        value: "discordbot"

      # Backwards-compatible fallback. This can stay blank when the three split
      # MongoDB credential variables above are configured.
      - key: MONGODB_URI
        sync: false

      # AI features.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-5.6-sol"
      - key: TICKET_RECAP_MODEL
        value: "gpt-5-mini"

      # Optional integrations. Leave blank if that feature is not used.
      - key: ERLC_SERVER_KEY
        sync: false
      - key: DOCK_API_KEY
        sync: false
      - key: BLOXLINK_API_KEY
        sync: false
      - key: MELONY_API_KEY
        sync: false
      - key: MELONY_API_URL
        sync: false
      - key: INGAME_API_URL
        sync: false

      # Explicit quota Moderator role. This prevents an old/mistyped dashboard
      # value from being confused with the quota log channel ID.
      - key: QUOTA_MOD_ROLE_ID
        value: "1521593407795888336"

      # Required for accurate guildMemberAdd join logs. Server Members Intent
      # must also be enabled in the Discord Developer Portal.
      - key: ENABLE_PRIVILEGED_INTENTS
        value: "true"

      - key: PORT
        value: "10000"
