# Render Blueprint Configuration
# Deploy on Render: https://render.com
#
# IMPORTANT: add private environment values in the Render Dashboard.
# Never commit live secrets.

services:
  - type: web
    name: discord-management-bot
    env: node
    # Use the committed lockfile so Render, CI, and local installs resolve the
    # same dependency versions instead of silently drifting between deploys.
    buildCommand: npm ci --include=dev --no-audit --no-fund
    startCommand: node index.js
    numInstances: 1

    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: NODE_ENV
        value: production
      - key: GUILD_ID
        value: "1521593407741362257"
      - key: BOT_TOKEN
        sync: false

      - key: MONGODB_USERNAME
        sync: false
      - key: MONGODB_PASSWORD
        sync: false
      - key: MONGODB_HOST
        sync: false
      - key: MONGODB_DATABASE
        value: "discordbot"
      - key: MONGODB_URI
        sync: false

      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-5.6-sol"
      - key: TICKET_RECAP_MODEL
        value: "gpt-5-mini"

      - key: ERLC_SERVER_KEY
        sync: false
      - key: DOCK_API_KEY
        sync: false
      - key: BLOXLINK_API_KEY
        sync: false
      - key: MELONY_API_KEY
        sync: false
      - key: MELONY_API_URL
        sync: false
      - key: INGAME_API_URL
        sync: false

      - key: QUOTA_MOD_ROLE_ID
        value: "1521593407795888336"

      - key: ENABLE_PRIVILEGED_INTENTS
        value: "true"

      - key: PORT
        value: "10000"
