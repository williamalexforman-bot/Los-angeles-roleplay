# Render Blueprint Configuration
# Deploy on Render: https://render.com
# Free tier supports this bot 24/7

services:
  - type: worker
    name: discord-management-bot
    env: node
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    numInstances: 1
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: BOT_TOKEN
        sync: false  # Set this in Render dashboard
      - key: MONGODB_URI
        sync: false
      - key: ENABLE_PRIVILEGED_INTENTS
        value: "true"
      # Add all other env vars from your .env in the Render dashboard

