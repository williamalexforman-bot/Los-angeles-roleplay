# Render Blueprint Configuration
# Deploy on Render: https://render.com
#
# IMPORTANT: add private environment values in the Render Dashboard.
# Never commit live secrets.

services:
  - type: web
    name: discord-management-bot
    env: node
    buildCommand: npm install --include=dev --no-audit --no-fund
    startCommand: node index.js
    numInstances: 1
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: NODE_ENV
        value: production
      - key: BOT_TOKEN
        sync: false

      # Recommended MongoDB Atlas setup for Render. Keeping the username,
      # password, and host separate lets the bot safely URL-encode credentials
      # instead of relying on a hand-built connection string.
      - key: MONGODB_USERNAME
        sync: false
      - key: MONGODB_PASSWORD
        sync: false
      - key: MONGODB_HOST
        sync: false
      - key: MONGODB_DATABASE
        value: "discordbot"

      # Backwards-compatible fallback. You can leave this unset when the three
      # variables above are configured.
      - key: MONGODB_URI
        sync: false

      - key: OPENAI_API_KEY
        sync: false
      - key: TICKET_RECAP_MODEL
        value: "gpt-5-mini"
      # Safe default: this keeps the bot online even if Discord has not yet
      # enabled the privileged Gateway Intents for the application. After
      # Server Members Intent + Message Content Intent are enabled in the
      # Discord Developer Portal, set this to "true" in Render to activate
      # message quota/member-event features.
      - key: ENABLE_PRIVILEGED_INTENTS
        value: "false"
      - key: PORT
        value: "10000"
