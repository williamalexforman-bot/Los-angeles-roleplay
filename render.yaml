# Render Blueprint Configuration
# Deploy on Render: https://render.com
#
# IMPORTANT: add your private environment variables in the Render Dashboard
# (BOT_TOKEN, MONGODB_URI, ERLC_SERVER_KEY, OPENAI_API_KEY, etc.). Never commit live secrets.

services:
  - type: web
    name: discord-management-bot
    env: node
    buildCommand: npm install --include=dev --no-audit --no-fund
    startCommand: node index.js
    numInstances: 1
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: NODE_ENV
        value: production
      - key: BOT_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TICKET_RECAP_MODEL
        value: "gpt-5-mini"
      # Safe default: this keeps the bot online even if Discord has not yet
      # enabled the privileged Gateway Intents for the application. After
      # Server Members Intent + Message Content Intent are enabled in the
      # Discord Developer Portal, set this to "true" in Render to activate
      # message quota/member-event features.
      - key: ENABLE_PRIVILEGED_INTENTS
        value: "false"
      - key: PORT
        value: "10000"
