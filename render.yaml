# Render Blueprint Configuration
# Deploy on Render: https://render.com
#
# IMPORTANT: add private environment values in the Render Dashboard.
# Never commit live secrets.

services:
  - type: web
    name: discord-management-bot
    env: node
    buildCommand: npm install --include=dev --no-audit --no-fund
    startCommand: node -r ./preload.js index.js
    numInstances: 1

    # Keep the Discord bot online continuously.
    # Render Free web services can spin down when idle; Starter is an always-on
    # paid instance type and should be used for a Discord bot that must receive
    # interactions, ticket buttons, applications, and activity-check responses
    # at all times.
    plan: starter

    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: NODE_ENV
        value: production
      - key: BOT_TOKEN
        sync: false

      # Recommended MongoDB Atlas setup for Render. Keeping the username,
      # password, and host separate lets the bot safely URL-encode credentials
      # instead of relying on a hand-built connection string.
      - key: MONGODB_USERNAME
        sync: false
      - key: MONGODB_PASSWORD
        sync: false
      - key: MONGODB_HOST
        sync: false
      - key: MONGODB_DATABASE
        value: "discordbot"

      # Backwards-compatible fallback. You can leave this unset when the three
      # variables above are configured.
      - key: MONGODB_URI
        sync: false

      - key: OPENAI_API_KEY
        sync: false
      - key: TICKET_RECAP_MODEL
        value: "gpt-5-mini"

      # Required for staff activity checks and the weekly message-quota system.
      # In the Discord Developer Portal, enable BOTH Server Members Intent and
      # Message Content Intent for the bot application.
      - key: ENABLE_PRIVILEGED_INTENTS
        value: "true"

      - key: PORT
        value: "10000"
