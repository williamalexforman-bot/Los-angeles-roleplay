# Render Blueprint Configuration
# Deploy on Render: https://render.com
#
# IMPORTANT: add your private environment variables in the Render Dashboard
# (BOT_TOKEN, MONGODB_URI, ERLC_SERVER_KEY, etc.). Never commit live secrets.

services:
  - type: web
    name: discord-management-bot
    env: node
    buildCommand: npm install --include=dev --no-audit --no-fund
    startCommand: node index.js
    numInstances: 1
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: NODE_ENV
        value: production
      - key: BOT_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: ENABLE_PRIVILEGED_INTENTS
        value: "true"
      - key: PORT
        value: "10000"
