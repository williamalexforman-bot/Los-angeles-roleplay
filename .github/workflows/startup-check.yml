name: Startup Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22.22.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install exactly from lockfile
        run: npm ci --include=dev --no-audit --no-fund

      - name: Import activity check module
        run: node -e "require('ts-node').register({transpileOnly:true,project:'tsconfig.json'}); require('./src/commands/activityCheck.ts'); console.log('activity-check import ok')"

      - name: Strict TypeScript check
        run: npm run typecheck
