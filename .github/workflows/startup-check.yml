name: Startup Check

on:
  pull_request:
    branches: [main]

jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22.22.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install exactly from lockfile
        run: npm ci --include=dev --no-audit --no-fund

      - name: Check index.js syntax
        run: node --check index.js

      - name: Verify Render health listener exists
        run: |
          grep -F "healthServer.listen(renderPort, '0.0.0.0'" index.js
          grep -F "req.url === '/health'" index.js
          grep -F "process.env.PORT" index.js

      - name: Strict TypeScript check
        run: npm run typecheck
